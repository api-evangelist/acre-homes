aid: acre-homes
name: Acre Homes
description: >-
  Acre Homes is a North Carolina-based homeownership company whose mission is to "create the best
  way to experience homeownership." Acre enables individuals to buy quality homes in desirable
  neighborhoods while sharing in ownership appreciation and reducing costs, notably without requiring
  traditional debt financing. Positioned in the wealth and asset management corner of fintech and
  proptech, the company reframes owning a home as a less financially burdensome decision than the
  conventional mortgage path, letting residents build equity through a shared-appreciation model
  rather than a conventional debt-financed purchase. Acre Homes is an early-stage venture-backed
  company and a portfolio company of Anthemis Group. It operates a consumer-facing homeownership
  offering and does not currently publish a public developer program, API, or developer documentation;
  this profile captures verified company identity and public links.
